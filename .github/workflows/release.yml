name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  tickets:
    name: Artifact tickets
    runs-on: [self-hosted, s31]
    outputs:
      tickets: ${{ steps.t.outputs.tickets }}
    steps:
      - id: t
        uses: Ankara-Software/ci-actions/artifact-ticket@v1
        with:
          names: logrustate-linux-x64 logrustate-linux-arm64 logrustate-darwin-x64 logrustate-darwin-arm64 logrustate-win32-x64.exe
          hours: "6"

  build:
    name: Build - ${{ matrix.target }}
    needs: tickets
    runs-on: ${{ fromJSON(matrix.runner) }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: '["self-hosted","s31"]'
            target: x86_64-unknown-linux-gnu
            asset_name: logrustate-linux-x64
            cross_arm64: false
          - os: linux
            runner: '["self-hosted","s31"]'
            target: aarch64-unknown-linux-gnu
            asset_name: logrustate-linux-arm64
            cross_arm64: true
          - os: macos
            runner: '["self-hosted","macOS","s11"]'
            target: x86_64-apple-darwin
            asset_name: logrustate-darwin-x64
            cross_arm64: false
          - os: macos
            runner: '["self-hosted","macOS","s11"]'
            target: aarch64-apple-darwin
            asset_name: logrustate-darwin-arm64
            cross_arm64: false
          - os: windows
            runner: '["self-hosted","Windows","s18"]'
            target: x86_64-pc-windows-msvc
            asset_name: logrustate-win32-x64.exe
            cross_arm64: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure rustup in PATH (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none -y --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install arm64 cross-linker (Linux)
        if: matrix.cross_arm64
        run: |
          if ! command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          fi

      - name: Build binary (Standard)
        if: ${{ !matrix.cross_arm64 }}
        run: cargo build --target ${{ matrix.target }} --release

      - name: Build binary (Linux arm64)
        if: matrix.cross_arm64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --target ${{ matrix.target }} --release

      - name: Prepare asset (Windows)
        if: matrix.os == 'windows'
        run: |
          Move-Item -Force "target\${{ matrix.target }}\release\logrustate.exe" "${{ matrix.asset_name }}"

      - name: Prepare asset (Unix)
        if: matrix.os != 'windows'
        run: |
          mv -f "target/${{ matrix.target }}/release/logrustate" "${{ matrix.asset_name }}"

      - name: Upload Artifact
        uses: Ankara-Software/ci-actions/artifact-upload@v1
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          ticket: ${{ toJSON(fromJSON(needs.tickets.outputs.tickets)[matrix.asset_name]) }}

  release:
    name: Create GitHub Release
    needs: [tickets, build]
    runs-on: [self-hosted, s31]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean workspace artifact directories
        run: rm -rf ./artifacts ./dist && mkdir -p ./artifacts ./dist

      - name: Download logrustate-linux-x64
        uses: Ankara-Software/ci-actions/artifact-download@v1
        with:
          name: logrustate-linux-x64
          path: ./artifacts/logrustate-linux-x64
          ticket: ${{ toJSON(fromJSON(needs.tickets.outputs.tickets)['logrustate-linux-x64']) }}

      - name: Download logrustate-linux-arm64
        uses: Ankara-Software/ci-actions/artifact-download@v1
        with:
          name: logrustate-linux-arm64
          path: ./artifacts/logrustate-linux-arm64
          ticket: ${{ toJSON(fromJSON(needs.tickets.outputs.tickets)['logrustate-linux-arm64']) }}

      - name: Download logrustate-darwin-x64
        uses: Ankara-Software/ci-actions/artifact-download@v1
        with:
          name: logrustate-darwin-x64
          path: ./artifacts/logrustate-darwin-x64
          ticket: ${{ toJSON(fromJSON(needs.tickets.outputs.tickets)['logrustate-darwin-x64']) }}

      - name: Download logrustate-darwin-arm64
        uses: Ankara-Software/ci-actions/artifact-download@v1
        with:
          name: logrustate-darwin-arm64
          path: ./artifacts/logrustate-darwin-arm64
          ticket: ${{ toJSON(fromJSON(needs.tickets.outputs.tickets)['logrustate-darwin-arm64']) }}

      - name: Download logrustate-win32-x64.exe
        uses: Ankara-Software/ci-actions/artifact-download@v1
        with:
          name: logrustate-win32-x64.exe
          path: ./artifacts/logrustate-win32-x64.exe
          ticket: ${{ toJSON(fromJSON(needs.tickets.outputs.tickets)['logrustate-win32-x64.exe']) }}

      - name: Flatten artifacts directory
        run: |
          find ./artifacts -type f -exec cp {} ./dist/ \;
          ls -la ./dist/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/logrustate-linux-x64
            dist/logrustate-linux-arm64
            dist/logrustate-darwin-x64
            dist/logrustate-darwin-arm64
            dist/logrustate-win32-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
